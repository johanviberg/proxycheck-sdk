name: Release Please

on:
  push:
    branches: [main]

# No top-level permissions — each job gets least-privilege grants below.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # release-please-action opens release PRs and creates tags/releases.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    # contents: write — needed to create the GitHub Release.
    # id-token: write — required by npm publish --provenance to mint a provenance attestation.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: 20
          # Disable caching in publish jobs to prevent cache-poisoning attacks.
          cache: false

      - name: Verify version consistency
        # Use an env var instead of interpolating the expression directly in the
        # script body to prevent template-injection attacks.
        env:
          TAG_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PACKAGE_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch between package.json and release tag"
            exit 1
          fi

      - name: Run tests
        run: pnpm run test:ci
        env:
          CI: true

      - name: Build package
        run: pnpm run build

      - name: Validate package
        run: |
          npx publint
          npx @arethetypeswrong/cli --pack . || echo "Type validation warnings detected but continuing..."
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          generate_release_notes: true
          files: |
            dist/**/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
