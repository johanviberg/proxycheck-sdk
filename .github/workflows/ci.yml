name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Deny all permissions at workflow level; each job grants only what it needs.
permissions: {}

jobs:
  # Detect what changed to optimize CI runs
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      tests: ${{ steps.filter.outputs.tests }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'rollup.config.*'
            tests:
              - 'tests/**'
              - 'jest.config.*'
              - '**/*.test.ts'
              - '**/*.spec.ts'
            docs:
              - '**/*.md'
              - 'docs/**'

  lint:
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709 # v4
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: 20

      - name: Lint code
        run: pnpm run check

      - name: Type check
        run: pnpm run type-check

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  test:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.tests == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22]
        include:
          # Test on other OS with latest Node only
          - os: windows-latest
            node: 20
          - os: macos-latest
            node: 20

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709 # v4
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Build package for compatibility tests
        run: pnpm run build

      - name: Run tests
        run: pnpm run test:ci
        env:
          CI: true

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-${{ matrix.os }}-node${{ matrix.node }}

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709 # v4
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: 20

      - name: Build package
        run: pnpm run build

      - name: Validate package
        run: |
          npx publint
          npx @arethetypeswrong/cli --pack . || echo "Type validation warnings detected but continuing..."
        continue-on-error: true

      - name: Check bundle size
        if: github.event_name == 'pull_request'
        uses: andresz1/size-limit-action@e7493a72a44b113341c0cf6186ab49c17c4b65c1 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install
          build_script: build
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  compatibility:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709 # v4
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: 20

      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Test CommonJS compatibility
        run: pnpm test:commonjs

      - name: Test ESM compatibility
        run: pnpm test:esm

      - name: Test TypeScript compatibility
        run: pnpm test:typescript

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709 # v4
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: 20

      - name: Run security audit
        run: pnpm audit --production
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@cdb760004ba9ea4d525f2e043745dfe85bb9077e # master HEAD (snyk/actions publishes no release tags)
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709 # v4
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: 20

      - name: Generate documentation
        run: pnpm run docs

      - name: Upload docs artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: docs-${{ github.sha }}
          path: docs/
          retention-days: 7

  # Summary job for branch protection
  ci-complete:
    needs: [lint, test, build, compatibility]
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    steps:
      - name: All checks passed
        env:
          NEEDS_RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          passed="true"
          if echo "$NEEDS_RESULTS" | grep -q '"failure"'; then
            passed="false"
          fi
          if [[ $passed == "true" ]]; then
            echo "All CI checks passed!"
            exit 0
          else
            echo "Some CI checks failed"
            exit 1
          fi
