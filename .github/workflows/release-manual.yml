name: Manual Release (Legacy)

on:
  push:
    tags:
      - 'v*'

# No top-level permissions — job gets least-privilege grants below.
permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # contents: write — needed to create the GitHub Release.
    # id-token: write — required for npm trusted publishing (OIDC) and provenance.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: 20
          # Disable caching in publish jobs to prevent cache-poisoning attacks.
          cache: false

      - name: Build package
        run: pnpm run build

      - name: Run tests
        run: pnpm run test:ci

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          generate_release_notes: true
          files: |
            dist/**/*

      # npm trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: authentication is via OIDC trusted publishing,
        # configured on npmjs.com for this repo + workflow. npm mints a
        # short-lived credential and a provenance attestation automatically.
        run: npm publish --provenance --access public
