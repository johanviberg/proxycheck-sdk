name: Manual Release (Legacy)

on:
  push:
    tags:
      - 'v*'

# No top-level permissions — job gets least-privilege grants below.
permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # contents: write — needed to create the GitHub Release.
    # id-token: write — required by npm publish --provenance to mint a provenance attestation.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: 20
          # Disable caching in publish jobs to prevent cache-poisoning attacks.
          cache: false

      - name: Build package
        run: pnpm run build

      - name: Run tests
        run: pnpm run test:ci

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
